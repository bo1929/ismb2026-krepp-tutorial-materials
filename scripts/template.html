<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{META_DESCRIPTION}}">
<meta name="author" content="{{META_AUTHOR}}">
<title>{{HTML_TITLE}}</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Menlo", Consolas,
    "Liberation Mono", monospace;

  /* Neutral gray chrome; accent only for links, active nav, CTAs */
  --bg-app:         #e4e5e9;
  --bg-sidebar:     #f0f1f5;
  --bg-main:        #fdfdfd;
  --bg-muted:       #ebecef;
  --bg-elevated:    #ffffff;

  --border:         #d5d7de;
  --border-strong:  #bfc2cc;

  --text:           #2c2d34;
  --text-head:      #16171c;
  --text-dim:       #5c5e69;

  --accent:         #366391;
  --accent-hover:   #2d5580;
  --accent-soft:    rgba(54, 99, 145, 0.13);
  --accent-muted:   #557fa5;
  --accent-track:   #dfe6f2;
  --chrome-border: rgba(54, 99, 145, 0.18);

  --head-tint:      #212c3d;

  --ok:             #2f7d6c;
  --ok-soft:        rgba(47, 125, 108, 0.09);

  --warn:           #a86b2f;
  --warn-soft:      rgba(168, 107, 47, 0.09);

  --danger:         #aa4a46;
  --danger-soft:    rgba(170, 74, 70, 0.07);

  --code-bg:        #e6e8ef;
  --code-ring:      #b8bcc8;
  --code-stripe:    #dcdee5;
  --inline-bg:      #dde1ea;

  --table-head:     #ebecef;

  --shadow-sm:      0 1px 2px rgba(20, 22, 32, 0.05);
  --shadow-panel:   0 0 0 1px rgba(20, 22, 32, 0.05),
    0 6px 20px rgba(20, 22, 32, 0.07);

  --btn-primary-fg:       #fdfefe;
  --btn-primary-fg-hover: #ffffff;

  --main-gutter:  0.65rem;

  --sidebar-w:    274px;
  --radius:       10px;
  --radius-sm:    7px;
  /* Main article column and fenced code (pre) max width */
  --page-text-max:  58rem;
  --pre-radius:       4px;
  --pre-pad-x:        0.75rem;
  --pre-pad-y:        0.52rem;
  --pre-chrome-inset: 0.22rem;
  --pre-chrome-h:     0.94rem;
  --pre-copy-slot:    3.35rem;
  --pre-lang-slot:    3.55rem;
  --pre-max:          min(calc(var(--page-text-max) - 1.25rem), calc(100% - 1.5rem));
  --pre-margin-block: 0.7rem;

  color-scheme: light;
}

html, body { height: 100%; font-size: 16px; }
body {
  background: var(--bg-app);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.65;
  display: flex;
  align-items: stretch;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* --- Sidebar ---------------------------------------------------- */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

#sidebar-header {
  padding: 1.08rem 1.15rem 0.88rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-sidebar) 100%);
}

.logo {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--text-dim);
  font-family: var(--font-sans);
  margin-bottom: 0.34rem;
}

#sidebar-header h1 {
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--head-tint);
  line-height: 1.32;
  font-family: var(--font-sans);
  letter-spacing: -0.02em;
}

.version {
  font-size: 0.695rem;
  color: var(--text-dim);
  margin-top: 0.3rem;
  font-family: var(--font-sans);
  font-weight: 500;
}

#nav-scroll {
  overflow-y: auto;
  flex: 1;
  padding: 0.42rem 0 0.88rem;
}

.nav-group {
  padding: 0.7rem 1.15rem 0.22rem;
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent-muted);
  margin-top: 0.28rem;
  font-family: var(--font-sans);
}

nav a {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin: 0 0.46rem;
  padding: 0.34rem 0.64rem;
  font-size: 0.8125rem;
  color: var(--text);
  text-decoration: none;
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
  transition: background 0.12s ease, color 0.12s ease, border-left-color 0.12s ease;
  cursor: pointer;
  font-family: var(--font-sans);
  line-height: 1.4;
}

nav a:hover {
  color: var(--text-head);
  background: var(--border);
}

nav a.active {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 600;
  border-left-color: var(--accent);
}

nav a .num {
  font-size: 0.595rem;
  color: var(--text-dim);
  min-width: 1.18rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

nav a.active .num { color: var(--accent); }

nav a[data-nav-level="2"] {
  padding-inline-start: 1rem;
}

nav a[data-nav-level="3"] {
  padding-inline-start: 1.3rem;
}

/* In-page TOC (current lesson h2), below main nav */
.page-toc-wrap {
  margin-top: 0.3rem;
  border-top: 1px solid var(--border);
  padding-top: 0.42rem;
}

.page-toc-wrap[hidden] {
  display: none !important;
}

.page-toc-summary {
  list-style: none;
  padding: 0.42rem 1.08rem 0.3rem;
  padding-inline-start: 1.28rem;
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent-muted);
  font-family: var(--font-sans);
  cursor: pointer;
  user-select: none;
}

.page-toc-summary::-webkit-details-marker {
  display: none;
}

.page-toc-summary::after {
  content: "";
  display: inline-block;
  width: 0.35rem;
  height: 0.35rem;
  margin-left: 0.4rem;
  border-right: 1.5px solid var(--accent-muted);
  border-bottom: 1.5px solid var(--accent-muted);
  transform: rotate(45deg) translateY(-0.1rem);
  vertical-align: middle;
  transition: transform 0.15s ease;
}

.page-toc-wrap[open] .page-toc-summary::after {
  transform: rotate(-135deg) translateY(0.05rem);
}

.page-toc-list {
  display: flex;
  flex-direction: column;
  gap: 0.06rem;
  padding: 0 0.44rem 0.46rem;
  padding-inline-start: 0.66rem;
  max-height: min(40vh, 16rem);
  overflow-y: auto;
}

.page-toc-link {
  display: flex;
  align-items: flex-start;
  gap: 0.36rem;
  width: 100%;
  text-align: left;
  margin: 0;
  padding: 0.24rem 0.58rem 0.24rem 0.48rem;
  font-size: 0.7425rem;
  line-height: 1.35;
  color: var(--text-dim);
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  border-left: 2px solid transparent;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-left-color 0.12s ease;
}

.page-toc-link::before {
  content: "";
  flex-shrink: 0;
  width: 0.3rem;
  height: 0.3rem;
  margin-top: 0.5em;
  border-radius: 50%;
  background: var(--accent-muted);
}

.page-toc-link:hover {
  color: var(--text-head);
  background: var(--border);
}

.page-toc-link:focus {
  outline: none;
}

.page-toc-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- Main column ------------------------------------------------ */
#main {
  flex: 1;
  min-height: 0;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-block: var(--main-gutter);
  margin-inline-end: var(--main-gutter);
  margin-inline-start: 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-main);
  box-shadow: var(--shadow-panel);
}

@media (max-width: 700px) {
  #main {
    margin: 0;
    border-radius: 0;
    border: none;
    box-shadow: none;
    align-self: stretch;
  }
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 0.7rem;
  padding-inline: 1.75rem;
  border-bottom: 1px solid var(--chrome-border);
  background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-main) 100%);
  flex-shrink: 0;
  gap: 1rem;
}

#topbar .section-title {
  font-size: 0.87rem;
  color: var(--head-tint);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--font-sans);
  font-style: normal;
  letter-spacing: -0.01em;
}

#topbar .page-counter {
  font-size: 0.76rem;
  color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-sans);
  font-weight: 500;
}

#progress-bar {
  height: 3px;
  background: var(--accent-track);
  flex-shrink: 0;
}

#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-muted));
  transition: width 0.25s ease;
  width: 0%;
}

#footer-scroll-track {
  flex: 1 1 auto;
  min-width: 2rem;
  max-width: 14rem;
  height: 5px;
  align-self: center;
  background: var(--accent-track);
  border-radius: 999px;
  overflow: hidden;
}

#footer-scroll-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-muted), var(--accent));
  border-radius: inherit;
  transition: none;
}

#pages {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: var(--bg-main);
}

.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 2.75rem clamp(1.35rem, 4.5vw, 2.75rem) 2.5rem;
  display: none;
  animation: fadeIn 0.22s ease;
  background: var(--bg-main);
}

.page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-inner {
  max-width: var(--page-text-max);
  margin-inline: auto;
}

/* --- Footer nav ----------------------------------------------- */
#bottomnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.75rem;
  padding-bottom: max(1.05rem, calc(0.5rem + env(safe-area-inset-bottom, 0px)));
  border-top: 1px solid var(--chrome-border);
  background: linear-gradient(0deg, var(--bg-muted) 0%, var(--bg-main) 100%);
  flex-shrink: 0;
  gap: 1rem;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-width: 6.5rem;
  padding: 0.5rem 1.1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.8rem;
  font-family: var(--font-sans);
  font-weight: 500;
  transition: border-color 0.12s, background 0.12s, color 0.12s, box-shadow 0.12s;
}

.nav-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-hover);
  background: var(--bg-main);
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.nav-btn.primary {
  color: var(--btn-primary-fg);
  background: linear-gradient(180deg, #4f7499, var(--accent));
  border-color: rgba(54, 99, 145, 0.4);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2) inset;
}

.nav-btn.primary:hover:not(:disabled) {
  color: var(--btn-primary-fg-hover);
  border-color: rgba(54, 99, 145, 0.6);
  background: linear-gradient(180deg, #446687, var(--accent-hover));
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset;
}

.nav-btn.primary:disabled {
  color: rgba(253, 252, 250, 0.75);
}

.nav-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- Prose --------------------------------------------- */
h1 {
  font-size: clamp(1.55rem, 2.8vw, 1.95rem);
  font-weight: 800;
  color: var(--head-tint);
  margin-bottom: 1rem;
  line-height: 1.22;
  font-family: var(--font-sans);
  letter-spacing: -0.03em;
  border-bottom: 1px solid var(--chrome-border);
  padding-bottom: 0.75rem;
}

h2 {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--head-tint);
  margin: 2.15rem 0 0.6rem;
  font-family: var(--font-sans);
  letter-spacing: -0.02em;
  line-height: 1.3;
  scroll-margin-top: 3.5rem;
}

h2:first-of-type { margin-top: 1.15rem; }

h3 {
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--text-dim);
  margin: 1.65rem 0 0.45rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: var(--font-sans);
}

h4 {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-head);
  margin: 1.1rem 0 0.35rem;
  font-family: var(--font-sans);
}

p { margin: 0.72rem 0; }

hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.25rem 0;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover { text-decoration: underline; text-underline-offset: 2px; }

strong {
  color: var(--text-head);
  font-weight: 650;
}

em { font-style: italic; }

ul, ol {
  padding-left: 1.35rem;
  margin: 0.6rem 0;
  font-size: 0.95rem;
}

li { margin: 0.32rem 0; }

li::marker { color: var(--text-dim); }

/* --- Code --------------------------------------------------- */
code {
  background: var(--inline-bg);
  color: var(--text-head);
  font-family: var(--font-mono);
  font-size: 0.813em;
  padding: 0.125em 0.4em;
  border-radius: var(--pre-radius);
  border: 1px solid var(--code-ring);
}

pre {
  background: var(--code-bg);
  border: 1px solid var(--code-ring);
  border-radius: var(--pre-radius);
  padding-block: var(--pre-pad-y);
  padding-inline: var(--pre-pad-x);
  margin: var(--pre-margin-block) 0;
  max-width: min(100%, var(--pre-max));
  position: relative;
  box-shadow: var(--shadow-sm);
  tab-size: 4;
  overflow-x: auto;
}

pre[data-lang]:not([data-lang=""]) {
  padding-top: calc(var(--pre-pad-y) + var(--pre-chrome-h) + 0.12rem);
}

pre[data-lang]:not([data-lang=""])::before {
  content: attr(data-lang);
  position: absolute;
  top: var(--pre-chrome-inset);
  left: var(--pre-chrome-inset);
  z-index: 1;
  font-family: var(--font-sans);
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-dim);
  line-height: 1.35;
  pointer-events: none;
}

pre code {
  display: block;
  border: none;
  padding: 0;
  background: transparent;
  color: var(--text-head);
  font-size: 0.8125rem;
  line-height: 1.5;
  white-space: pre;
  overflow-wrap: normal;
  tab-size: 4;
}

pre code span {
  display: block;
  padding: 0.05em 0.45rem;
  padding-right: calc(var(--pre-copy-slot) + 0.35rem);
  min-height: 1.5em;
}

pre code span.l0 { background: var(--code-bg); }
pre code span.l1 { background: var(--code-stripe); }

p > pre {
  margin-top: 0.35rem;
}

.pre-copy-btn {
  position: absolute;
  top: var(--pre-chrome-inset);
  right: var(--pre-chrome-inset);
  left: auto;
  z-index: 2;
  padding: 0.12rem 0.38rem;
  border: 1px solid var(--code-ring);
  border-radius: var(--pre-radius);
  background: var(--bg-elevated);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 0.585rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.35;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

.pre-copy-btn:hover {
  color: var(--text-head);
  border-color: var(--border-strong);
  background: var(--bg-main);
}

.pre-copy-btn:focus {
  outline: none;
}

.pre-copy-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.pre-copy-btn.state-ok {
  color: var(--ok);
  border-color: rgba(47, 125, 108, 0.45);
  background: var(--ok-soft);
}

.pre-copy-btn.state-err {
  color: var(--danger);
  border-color: rgba(170, 74, 70, 0.45);
  background: var(--danger-soft);
}

/* --- Tables ------------------------------------------------- */
.table-wrap {
  overflow-x: auto;
  margin: 0.9rem 0 1.05rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

th {
  background: var(--table-head);
  color: var(--text-head);
  font-weight: 600;
  text-align: left;
  padding: 0.52rem 0.92rem;
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 0.54rem 0.92rem;
  border-top: 1px solid var(--border);
  vertical-align: top;
}

tr:hover td { background: rgba(22, 23, 30, 0.035); }

/* --- Admonitions -------------------------------------------- */
.admonition {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  padding: 0.9rem 1.05rem;
  margin: 1.05rem 0;
  font-size: 0.9rem;
  font-family: var(--font-sans);
  box-shadow: var(--shadow-sm);
}

.admonition-title {
  display: block;
  margin: 0 0 0.5rem;
  font-size: 0.6875rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: inherit;
}

.admonition-title code {
  font-size: 0.95em;
  text-transform: none;
  letter-spacing: 0;
}

.admonition > .admonition-title + p,
.admonition > .admonition-title + ul,
.admonition > .admonition-title + ol,
.admonition > .admonition-title + pre,
.admonition > .admonition-title + .table-wrap {
  margin-top: 0;
}

.admonition > p,
.admonition > ul,
.admonition > ol,
.admonition > pre,
.admonition > .table-wrap {
  margin-top: 0.5rem;
  margin-bottom: 0.5rem;
}

.admonition > p:first-child { margin-top: 0; }
.admonition > *:last-child { margin-bottom: 0; }

.admonition ul,
.admonition ol {
  padding-left: 1.2rem;
  margin-top: 0.45rem;
  margin-bottom: 0.45rem;
}

.admonition li {
  margin: 0.22rem 0;
}

.admonition li > p {
  margin: 0.15rem 0;
}

/* Nested callouts: pre must fit the box, not the full page column (--pre-max) */
.admonition pre,
details.question pre,
details.more pre,
details.admonition pre {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  margin-inline: 0;
  margin-block: 0.55rem;
}

.admonition pre code,
details.question pre code,
details.more pre code,
details.admonition pre code {
  max-width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.admonition pre code span,
details.question pre code span,
details.more pre code span,
details.admonition pre code span {
  padding-right: 0.45rem;
}

.admonition pre:first-child,
.admonition > pre:first-of-type {
  margin-top: 0;
}

.admonition.note,
.admonition.info {
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

.admonition.tip,
.admonition.success {
  border-left-color: var(--ok);
  background: var(--ok-soft);
}

.admonition.warning {
  border-left-color: var(--warn);
  background: var(--warn-soft);
}

.admonition.danger,
.admonition.abstract {
  border-left-color: var(--danger);
  background: var(--danger-soft);
}

.admonition.next {
  border-left-width: 5px;
  border-left-color: var(--accent);
  background: linear-gradient(
    90deg,
    rgba(54, 99, 145, 0.16) 0,
    rgba(54, 99, 145, 0.08) 0.85rem,
    var(--accent-soft) 2.05rem,
    var(--accent-soft)
  );
  padding-left: 2.05rem;
  position: relative;
  box-shadow: var(--shadow-sm), inset 0.45rem 0 0 rgba(54, 99, 145, 0.12);
}

.admonition.next::before {
  content: "";
  position: absolute;
  left: 0.82rem;
  top: 0.88rem;
  width: 0.52rem;
  height: 0.52rem;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: rgba(253, 253, 253, 0.85);
}

.admonition.next .admonition-title {
  color: var(--accent);
}

/* collapsible ------------------------------------------------ */
details.question,
details.admonition.question {
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-left: 4px solid var(--ok);
  border-radius: var(--radius-sm);
  padding: 0;
  margin: 0.7rem 0;
  box-shadow: var(--shadow-sm);
}

details.question > summary,
details.admonition > summary {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.55rem 1rem 0.55rem 2.55rem;
  font-size: 0.8725rem;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
  position: relative;
  font-family: var(--font-sans);
  color: var(--text-head);
}

details.question > summary::-webkit-details-marker,
details.admonition > summary::-webkit-details-marker { display: none; }

details.question > summary::before,
details.admonition > summary::before {
  content: "?";
  position: absolute;
  left: 0.78rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.15rem;
  height: 1.15rem;
  background: var(--ok);
  color: #fff;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

details.question[open] > summary,
details.admonition[open] > summary {
  border-bottom: 1px solid var(--border);
}

details.question > :not(summary),
details.admonition > :not(summary) {
  padding: 0.7rem 1rem 0.85rem 2.55rem;
  font-family: var(--font-sans);
  font-size: 0.9rem;
}

details.question > :not(summary) > p,
details.admonition > :not(summary) > p,
details.more > :not(summary) > p {
  margin: 0.4rem 0;
}

details.question > :not(summary) > p:first-child,
details.admonition > :not(summary) > p:first-child,
details.more > :not(summary) > p:first-child {
  margin-top: 0;
}

details.question > :not(summary) > p:last-child,
details.admonition > :not(summary) > p:last-child,
details.more > :not(summary) > p:last-child {
  margin-bottom: 0;
}

details.question > :not(summary) ul,
details.question > :not(summary) ol,
details.more > :not(summary) ul,
details.more > :not(summary) ol {
  padding-left: 1.2rem;
  margin: 0.4rem 0;
}

/* collapsible optional detail (`??? more`), not quiz-style --------- */
details.more {
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent-muted);
  border-radius: var(--radius-sm);
  padding: 0;
  margin: 0.7rem 0;
  box-shadow: var(--shadow-sm);
}

details.more > summary {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.55rem 1rem 0.55rem 2.55rem;
  font-size: 0.8725rem;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
  position: relative;
  font-family: var(--font-sans);
  color: var(--text-head);
}

details.more > summary::-webkit-details-marker { display: none; }

details.more > summary::before {
  content: "+";
  position: absolute;
  left: 0.78rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.15rem;
  height: 1.15rem;
  background: var(--accent-muted);
  color: #fff;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

details.more[open] > summary {
  border-bottom: 1px solid var(--border);
}

details.more[open] > summary::before {
  content: "-";
  font-size: 0.85rem;
}

details.more > :not(summary) {
  padding: 0.7rem 1rem 0.85rem 2.55rem;
  font-family: var(--font-sans);
  font-size: 0.9rem;
}

/* badges (unused in source but kept) ---------------------------- */
.section-meta {
  display: flex;
  gap: 0.45rem;
  align-items: center;
  margin-bottom: 1.1rem;
  flex-wrap: wrap;
}

.badge {
  font-size: 0.59rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 0.2rem 0.52rem;
  border-radius: 5px;
  background: var(--bg-muted);
  color: var(--text-dim);
  border: 1px solid var(--border);
  font-family: var(--font-sans);
}

@media (max-width: 900px) {
  .page-inner { max-width: 100%; }
}

@media (max-width: 700px) {
  #sidebar { display: none; }
  .page { padding: 1.35rem 1rem 1rem; }
  #bottomnav {
    padding-top: 0.62rem;
    padding-inline: 1rem;
    padding-bottom: max(1.25rem, calc(0.5rem + env(safe-area-inset-bottom, 0px)));
  }
  #topbar { padding: 0.55rem 1rem; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <div class="logo">{{SIDEBAR_KICKER}}</div>
    <h1>{{SIDEBAR_HEADING}}</h1>
    <div class="version">{{SIDEBAR_TAGLINE}}</div>
  </div>
  <div id="nav-scroll">
    <nav id="nav">
      {{NAV}}
    </nav>
    <details id="page-toc-wrap" class="page-toc-wrap" open hidden>
      <summary class="page-toc-summary">On this page</summary>
      <div id="page-toc-list" class="page-toc-list"></div>
    </details>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <span class="section-title" id="topbar-title"></span>
    <span class="page-counter" id="topbar-counter"></span>
  </div>
  <div id="progress-bar" role="progressbar" aria-label="Progress through tutorial sections" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>

  <div id="pages">
    {{PAGES}}
  </div>

  <div id="bottomnav">
    <button class="nav-btn" id="prev-btn">&#8592; {{FOOTER_PREV}}</button>
    <div id="footer-scroll-track" role="progressbar" aria-label="Scroll progress on this page" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="footer-scroll-fill"></div>
    </div>
    <button class="nav-btn primary" id="next-btn">{{FOOTER_NEXT}} &#8594;</button>
  </div>
</div>

<script>
const PAGES = document.querySelectorAll('.page');
const LINKS = document.querySelectorAll('nav a[data-page]');
const TOTAL = PAGES.length;

const topbarTitle    = document.getElementById('topbar-title');
const topbarCounter  = document.getElementById('topbar-counter');
const progressFill   = document.getElementById('progress-fill');
const pageIndexBar   = document.getElementById('progress-bar');
const footerScrollFill = document.getElementById('footer-scroll-fill');
const footerScrollTrack = document.getElementById('footer-scroll-track');
const prevBtn        = document.getElementById('prev-btn');
const nextBtn        = document.getElementById('next-btn');

{{HB_FOOTER_VARS}}

const PAGE_TITLES = [...PAGES].map((page, i) => {
  const h1 = page.querySelector('.page-inner h1');
  const raw = h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : '';
  return raw || ('Page ' + (i + 1));
});

let current = 0;

function updatePageIndexProgress() {
  if (!progressFill || !pageIndexBar || TOTAL < 1) return;
  const pct = Math.round(((current + 1) / TOTAL) * 100);
  progressFill.style.width = pct + '%';
  pageIndexBar.setAttribute('aria-valuenow', String(pct));
}

function updateFooterScrollProgress(scrollEl) {
  if (!footerScrollFill || !footerScrollTrack || !scrollEl) return;
  const denom = scrollEl.scrollHeight - scrollEl.clientHeight;
  let pct;
  if (denom <= 0.5) pct = 100;
  else pct = Math.round(Math.min(100, Math.max(0, (scrollEl.scrollTop / denom) * 100)));
  footerScrollFill.style.width = pct + '%';
  footerScrollTrack.setAttribute('aria-valuenow', String(pct));
}

PAGES.forEach(page => {
  page.addEventListener('scroll', e => {
    const el = e.target;
    if (el !== PAGES[current] || !el.classList.contains('active')) return;
    updateFooterScrollProgress(el);
  }, { passive: true });
});

window.addEventListener('resize', () => {
  const p = PAGES[current];
  if (p && p.classList.contains('active')) updateFooterScrollProgress(p);
});

const pageTocWrap = document.getElementById('page-toc-wrap');
const pageTocList = document.getElementById('page-toc-list');

function findHeadingInPage(page, id) {
  if (!page || !id) return null;
  return page.querySelector('[id=' + JSON.stringify(id) + ']');
}

function jumpToHeadingInActivePage(anchorId) {
  const page = PAGES[current];
  const target = findHeadingInPage(page, anchorId);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function rebuildPageToc() {
  if (!pageTocWrap || !pageTocList) return;
  pageTocList.innerHTML = '';

  const page = PAGES[current];
  if (!page) {
    pageTocWrap.hidden = true;
    return;
  }
  const headings = page.querySelectorAll('.page-inner h2[id]');
  if (headings.length === 0) {
    pageTocWrap.hidden = true;
    return;
  }

  pageTocWrap.hidden = false;

  headings.forEach(h2 => {
    const id = h2.id;
    if (!id) return;
    const label = h2.textContent.replace(/\s+/g, ' ').trim();
    const sideBtn = document.createElement('button');
    sideBtn.type = 'button';
    sideBtn.className = 'page-toc-link toc-jump';
    sideBtn.dataset.anchorId = id;
    sideBtn.setAttribute('aria-label', 'Jump to section: ' + label);
    sideBtn.textContent = label;
    pageTocList.appendChild(sideBtn);
  });
}

document.body.addEventListener('click', e => {
  const btn = e.target.closest('.toc-jump');
  if (!btn || !btn.dataset.anchorId) return;
  e.preventDefault();
  jumpToHeadingInActivePage(btn.dataset.anchorId);
});

function goTo(n, animate = true) {
  if (n < 0 || n >= TOTAL) return;
  PAGES[current].classList.remove('active');
  LINKS.forEach(a => a.classList.remove('active'));

  current = n;

  const page = PAGES[current];
  if (animate) {
    page.style.animation = 'none';
    page.offsetHeight;
    page.style.animation = '';
  }
  page.classList.add('active');
  page.scrollTop = 0;

  const link = document.querySelector(`nav a[data-page="${current}"]`);
  if (link) {
    link.classList.add('active');
    link.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  topbarTitle.textContent = PAGE_TITLES[current];
  topbarCounter.textContent = `${current + 1} / ${TOTAL}`;
  updatePageIndexProgress();
  updateFooterScrollProgress(page);

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === TOTAL - 1;
  prevBtn.textContent = current === 0 ? '\u2190 ' + HB_FOOTER_PREV
    : '\u2190 ' + (PAGE_TITLES[current - 1].split('\u2014')[0].trim() || HB_FOOTER_PREV);
  nextBtn.textContent = current === TOTAL - 1 ? HB_FOOTER_NEXT + ' \u2192'
    : (PAGE_TITLES[current + 1].split('\u2014')[0].trim() || HB_FOOTER_NEXT) + ' \u2192';

  history.replaceState(null, '', '#p' + current);
  rebuildPageToc();
}

LINKS.forEach(a => { a.addEventListener('click', () => goTo(parseInt(a.dataset.page))); });
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
    e.preventDefault(); goTo(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault(); goTo(current - 1);
  } else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End')  { e.preventDefault(); goTo(TOTAL - 1); }
});

const hashMatch = location.hash.match(/^#p(\d+)$/);
goTo(hashMatch ? Math.min(parseInt(hashMatch[1]), TOTAL - 1) : 0, false);

function copyPlainText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      if (document.execCommand('copy')) resolve();
      else reject(new Error('execCommand failed'));
    } catch (e) {
      reject(e);
    } finally {
      document.body.removeChild(ta);
    }
  });
}

const PRE_COPY_BTN_LABEL = 'Copy';
const PRE_COPY_FEEDBACK_OK_MS = 2000;
const PRE_COPY_FEEDBACK_ERR_MS = 2500;

function resetPreCopyButton(btn, ms) {
  clearTimeout(btn._copyReset);
  btn._copyReset = setTimeout(() => {
    btn.classList.remove('state-ok', 'state-err');
    btn.textContent = PRE_COPY_BTN_LABEL;
  }, ms);
}

(function initPreCopyButtons() {
  document.querySelectorAll('pre > code').forEach(code => {
    const pre = code.parentElement;
    if (!pre || pre.querySelector('.pre-copy-btn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pre-copy-btn';
    btn.setAttribute('aria-label', 'Copy code to clipboard');
    btn.textContent = PRE_COPY_BTN_LABEL;

    btn.addEventListener('click', () => {
      const txt = code.innerText.replace(/\r\n/g, '\n');
      copyPlainText(txt).then(
        () => {
          btn.classList.remove('state-err');
          btn.classList.add('state-ok');
          btn.textContent = 'Copied';
          resetPreCopyButton(btn, PRE_COPY_FEEDBACK_OK_MS);
        },
        () => {
          btn.classList.remove('state-ok');
          btn.classList.add('state-err');
          btn.textContent = 'Failed';
          resetPreCopyButton(btn, PRE_COPY_FEEDBACK_ERR_MS);
        }
      );
    });

    pre.appendChild(btn);
  });
})();
</script>
</body>
</html>
